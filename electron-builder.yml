appId: com.querynator.app
productName: Querynator
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
win:
  target: nsis
  artifactName: ${productName}-${version}-windows-x64-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  # The build workflow renames the architecture to "apple-silicon" / "intel" (no macro for that).
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
  category: public.app-category.developer-tools
  # Ad-hoc signature: required for Apple Silicon to start the app at all. Not notarized, so Gatekeeper asks once.
  identity: '-'
  # Required with ad-hoc signing, otherwise library validation rejects Electron's own frameworks.
  hardenedRuntime: false
linux:
  target: [AppImage, deb, tar.gz]
  # Fixed "x64": each Linux format spells the architecture differently (x86_64, amd64, x64).
  artifactName: ${productName}-${version}-linux-x64.${ext}
  category: Development
  maintainer: Querynator <noreply@querynator.local>
  synopsis: Desktop SOQL client for Salesforce
  syncDesktopName: true
deb:
  # electron-builder's defaults plus the libraries Electron needs that minimal installs lack.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2t64 | libasound2
