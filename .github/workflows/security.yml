name: Security

# Free scanners that work in private repositories (GitHub code scanning / CodeQL needs Advanced Security there).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC, catches newly published advisories
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Fails on high/critical advisories; lower ones are listed in the log and handled by Dependabot.
      - run: npm audit --audit-level=high

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner --verbose

  code:
    name: Code (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.177.0
    steps:
      - uses: actions/checkout@v7
      - name: semgrep
        run: >
          semgrep scan --error --metrics off
          --config p/javascript --config p/typescript --config p/react --config p/nodejs --config p/secrets
          --exclude node_modules --exclude out --exclude dist

  electron:
    name: Electron config (Electronegativity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: electronegativity
        run: |
          electron=$(node -p "require('./package.json').devDependencies.electron.replace(/^[^0-9]*/, '')")
          npx -y @doyensec/electronegativity@1.10.3 -i src -o electronegativity.csv -r -e "$electron"
          cat electronegativity.csv
          # Medium findings are review items (preload, openExternal, …); fail only on high or critical.
          if grep -qE '"(HIGH|CRITICAL)"' electronegativity.csv; then
            echo "::error::Electronegativity found high or critical issues"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: electronegativity-report
          path: electronegativity.csv
          retention-days: 7
