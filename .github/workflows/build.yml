name: Build installers

# - Push a tag like v0.2.0 (or create a GitHub Release with a new v* tag): builds all platforms and attaches the
#   installers to that tag's Release (the Release is created if it doesn't exist yet).
# - Run manually from the Actions tab: leave "tag" empty for a test build (installers only as run artifacts), or enter
#   an existing tag to build that tag and attach the installers to its Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to its Release (empty = test build only)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # Tag being released, or empty for a test build.
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Use the tag as app version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: npm pkg set version="${RELEASE_TAG#v}"

      - run: npm test

      - run: npm run build

      - name: Package
        shell: bash
        run: |
          args=(${{ matrix.args }} --publish never)
          # Windows: sign with Azure Artifact Signing when the repository is configured for it (see README).
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$SIGNING_ENDPOINT" ]; then
            echo "Signing Windows build with Azure Artifact Signing (profile: $SIGNING_PROFILE)"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            args+=(
              "-c.win.azureSignOptions.endpoint=$SIGNING_ENDPOINT"
              "-c.win.azureSignOptions.codeSigningAccountName=$SIGNING_ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$SIGNING_PROFILE"
              "-c.win.azureSignOptions.publisherName=$SIGNING_PUBLISHER"
            )
          elif [ "$RUNNER_OS" = "Windows" ]; then
            echo "::notice::Windows build is not signed (Azure signing secrets/variables not configured)"
          fi
          npx electron-builder "${args[@]}"
        env:
          # No Apple Developer certificate: the macOS app is ad-hoc signed (see electron-builder.yml).
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Azure Artifact Signing (Windows). Secrets: app registration credentials. Variables: account details.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}

      - name: Verify Windows signature
        if: runner.os == 'Windows' && env.SIGNED == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "$($exe.Name): $($sig.Status) — $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Installer signature is $($sig.Status)" }

      - uses: actions/upload-artifact@v7
        with:
          name: querynator-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  release:
    # One job uploads everything, so the platform builds don't race to create the Release.
    needs: build
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - run: ls -la installers

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: installers/*
          fail_on_unmatched_files: true
