version: 2
updates:
  # Weekly dependency update PRs; minor and patch updates are grouped into one PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Must match the Node.js version inside Electron (Electron 44 = Node 24), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # Keep the pinned GitHub Actions current as well.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
